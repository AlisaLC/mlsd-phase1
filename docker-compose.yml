# Phase 1 stack. Phase 2 adds the api and prometheus services.
# Run it through the Makefile, which sets HOST_UID, HOST_GID, MLFLOW_PORT and PIPELINE_IMAGE.
x-pipeline-base: &pipeline-base
  image: ${PIPELINE_IMAGE:?run it through make}
  user: "${HOST_UID:?run it through make}:${HOST_GID:?run it through make}"
  volumes:
    - .:/work

services:
  mlflow:
    <<: *pipeline-base
    # The job runner serves only MLflow's GenAI features, and takes gigabytes of memory while idle.
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    # One worker is enough for one user, and each one is a few hundred MB. MLflow rejects Host headers it does not
    # list: other containers reach it as mlflow:5000, your browser as localhost:MLFLOW_PORT.
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////work/mlflow.db
      --artifacts-destination /work/mlartifacts
      --allowed-hosts mlflow:5000,localhost:${MLFLOW_PORT},127.0.0.1:${MLFLOW_PORT}
    ports:
      - "127.0.0.1:${MLFLOW_PORT}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 2s
      timeout: 5s
      retries: 60

  pipeline:
    <<: *pipeline-base
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    # Only for `docker compose run`: the profile keeps `docker compose up` from starting it.
    profiles: [run]
